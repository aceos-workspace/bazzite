name: Build ISOs

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-iso
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image_name:
          # - bazzite
          # - bazzite-nvidia
          - bazzite-nvidia-open
          # - bazzite-gnome
          # - bazzite-gnome-nvidia
          # - bazzite-gnome-nvidia-open
          # - bazzite-deck
          # - bazzite-deck-gnome
          # - bazzite-ally
          # - bazzite-ally-gnome
          # - bazzite-asus
          # - bazzite-gnome-asus
          # - bazzite-asus-nvidia
          # - bazzite-gnome-asus-nvidia
          # - bazzite-asus-nvidia-open
          # - bazzite-gnome-asus-nvidia-open
          # - bazzite-surface
          # - bazzite-gnome-surface
          # - bazzite-surface-nvidia-open
          # - bazzite-gnome-surface-nvidia-open
          # - bazzite-deck-nvidia
          # - bazzite-deck-nvidia-gnome
        major_version: [43]
    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Set Image Tag
        id: generate-tag
        shell: bash
        run: |
          TAG="stable"

          if [[ "${{ github.ref_name }}" == "testing" ]]; then
              TAG="testing"
          fi

          # Would like to implement in the future. This will allow us to support image tags from a PR.
          #if [[ github.event.number ]]; then
          #  TAG="pr-${{ github.event.number }}-${{ matrix.major_version }}"
          #fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set Flatpaks Directory Shortname
        id: generate-flatpak-dir-shortname
        shell: bash
        run: |
          FLATPAK_DIR_SHORTNAME="installer/kde_flatpaks"

          if [[ "${{ matrix.image_name }}" =~ "gnome" ]]; then
            FLATPAK_DIR_SHORTNAME="installer/gnome_flatpaks"
          fi

          echo "flatpak-dir-shortname=${FLATPAK_DIR_SHORTNAME}" >> $GITHUB_OUTPUT

      - name: Set Extra Boot Params
        id: generate-extra-params
        shell: bash
        run: |
          EXTRA_BOOT_PARAMS=""

          if [[ "${{ matrix.image_name }}" =~ "deck" ]]; then
            EXTRA_BOOT_PARAMS="inst.resolution=1280x800"
          fi

          echo "extra-boot-params=${EXTRA_BOOT_PARAMS}" >> $GITHUB_OUTPUT

      # Docker requires lowercase registry references

      - name: Lowercase Registry
        id: registry_case
        shell: bash
        run: |
          echo "lowercase=${IMAGE_REGISTRY,,}" >> "$GITHUB_OUTPUT"


      - name: Determine Flatpak Dependencies
        id: flatpak_dependencies
        shell: bash
        run: |
          set -ex
          image="${{ steps.registry_case.outputs.lowercase }}/${{ matrix.image_name }}:${{ steps.generate-tag.outputs.tag }}"
          # Make temp space
          TEMP_FLATPAK_INSTALL_DIR=$(mktemp -d -p ${{ github.workspace }} flatpak.XXX)
          # Get list of refs from directory
          FLATPAK_REFS_DIR=${{ github.workspace }}/${{ steps.generate-flatpak-dir-shortname.outputs.flatpak-dir-shortname }}
          FLATPAK_REFS_DIR_LIST=$(cat ${FLATPAK_REFS_DIR}/* | tr '\n' ' ' )
          # Generate install script
          cat << EOF > ${TEMP_FLATPAK_INSTALL_DIR}/script.sh
          cat /temp_flatpak_install_dir/script.sh
          mkdir -p /flatpak/flatpak /flatpak/triggers
          mkdir /var/tmp || true
          chmod -R 1777 /var/tmp
          flatpak config --system --set languages "*"
          flatpak remote-add --system flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system -y ${FLATPAK_REFS_DIR_LIST}
          ostree refs --repo=\${FLATPAK_SYSTEM_DIR}/repo | grep '^deploy/' | grep -v 'org\.freedesktop\.Platform\.openh264' | sed 's/^deploy\///g' > /output/flatpaks_with_deps
          EOF
          docker run --rm --privileged \
            --entrypoint bash \
            -e FLATPAK_SYSTEM_DIR=/flatpak/flatpak \
            -e FLATPAK_TRIGGERSDIR=/flatpak/triggers \
            --volume ${FLATPAK_REFS_DIR}:/output \
            --volume ${TEMP_FLATPAK_INSTALL_DIR}:/temp_flatpak_install_dir \
            ${image} /temp_flatpak_install_dir/script.sh
          docker rmi ${image}

      - name: Setup Bazzite Repo
        id: setup-bazzite-repo
        shell: bash
        run: |
          curl -Lo ${{ github.workspace }}/bazzite.repo https://copr.fedorainfracloud.org/coprs/ublue-os/bazzite/repo/fedora-${{ matrix.major_version }}/bazzite-org-bazzite-fedora-${{ matrix.major_version }}.repo

      - name: Build ISOs
        uses: jasonn3/build-container-installer@c9ef3de33236e66781ec37bd0485e8009eaefe24 # v1.4.0
        id: build
        with:
          arch: x86_64
          image_name: ${{ matrix.image_name }}
          image_repo: ${{ steps.registry_case.outputs.lowercase }}
          variant: 'Kinoite'
          version: ${{ matrix.major_version }}
          image_tag: ${{ steps.generate-tag.outputs.tag }}
          secure_boot_key_url: '${{ github.server_url }}/${{ github.repository }}/raw/main/secure_boot.der'
          enrollment_password: 'universalblue'
          iso_name: ${{ matrix.image_name }}-${{ steps.generate-tag.outputs.tag }}-amd64.iso
          enable_cache_dnf: "false"
          enable_cache_skopeo: "false"
          flatpak_remote_refs_dir: ${{ steps.generate-flatpak-dir-shortname.outputs.flatpak-dir-shortname }}
          enable_flatpak_dependencies: "false"
          extra_boot_params: ${{ steps.generate-extra-params.outputs.extra-boot-params }}
          additional_templates: '/github/workspace/installer/lorax_templates/remove_root_password_prompt.tmpl /github/workspace/installer/lorax_templates/set_default_user.tmpl /github/workspace/installer/lorax_templates/bazzite_patches.tmpl'
          repos: '/github/workspace/bazzite.repo /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora-updates.repo'

      - name: Patch pxeboot initrd
        shell: bash
        run: |
          set -xeuo pipefail

          sudo apt-get update
          sudo apt-get install -y cpio gzip isomd5sum xorriso xz-utils

          ISO_DIR=$(readlink -f "${{ steps.build.outputs.iso_path }}")
          ISO_NAME="${{ steps.build.outputs.iso_name }}"

          WORKDIR=$(mktemp -d)
          trap 'sudo rm -rf "$WORKDIR"' EXIT

          ISO_PATH="${ISO_DIR}/${ISO_NAME}"
          ORIG_INITRD="$WORKDIR/initrd.orig.img"
          INITRD_WORK="$WORKDIR/initrd-work"
          FIXED_INITRD="$WORKDIR/initrd.fixed.img"

          PATCHED_ISO="$WORKDIR/${ISO_NAME}.patched"

          sudo xorriso -osirrox on -indev "$ISO_PATH" -extract /images/pxeboot/initrd.img "$ORIG_INITRD"

          mkdir -p "$INITRD_WORK"
          cd "$INITRD_WORK"

          # User's exact manual extraction (run with sudo to successfully create device nodes)
          sudo bash -c "xzcat '$ORIG_INITRD' | cpio -idmv"

          # User's exact modification
          if [ -e sbin/mount.ntfs ]; then
            sudo mv sbin/mount.ntfs sbin/mount.ntfs.orig
          fi
          
          sudo mkdir -p sbin
          sudo bash -c "cat > sbin/mount.ntfs <<'EOF'
          #!/bin/sh
          # Redirect any \"mount -t ntfs\" to the in-kernel ntfs3 driver during initramfs.
          # Try to locate a usable mount binary.
          if command -v mount >/dev/null 2>&1; then
            MNT=\"\$(command -v mount)\"
          elif [ -x /usr/bin/mount ]; then
            MNT=\"/usr/bin/mount\"
          elif [ -x /bin/mount ]; then
            MNT=\"/bin/mount\"
          else
            # Fallback: hope PATH resolves it
            MNT=\"mount\"
          fi
          exec \"\$MNT\" -t ntfs3 \"\$@\"
          EOF"

          sudo chmod +x sbin/mount.ntfs

          sudo mkdir -p etc/modules-load.d
          sudo bash -c "printf 'ntfs3\nloop\niso9660\nsr_mod\n' > etc/modules-load.d/early.conf"

          # User's exact repack (run with sudo to read device nodes)
          sudo bash -c "find . | cpio -H newc -o | xz -C crc32 -z -9e > '$FIXED_INITRD'"

          cd "$WORKDIR"

          sudo xorriso -indev "$ISO_PATH" \
            -outdev "$PATCHED_ISO" \
            -map "$FIXED_INITRD" /images/pxeboot/initrd.img \
            -boot_image any replay \
            -commit

          sudo mv -f "$PATCHED_ISO" "$ISO_PATH"
          sudo implantisomd5 "$ISO_PATH"
          sudo checkisomd5 --verbose "$ISO_PATH"



      - name: Sign EFI binaries for Secure Boot
        shell: bash
        env:
          GRUB_SIGNING_KEY:  ${{ secrets.GRUB_SIGNING_KEY }}
          GRUB_SIGNING_CERT: ${{ secrets.GRUB_SIGNING_CERT }}
        run: |
          set -xeuo pipefail

          sudo apt-get install -y sbsigntool mtools

          ISO_DIR=$(readlink -f "${{ steps.build.outputs.iso_path }}")
          ISO_NAME="${{ steps.build.outputs.iso_name }}"
          ISO_PATH="${ISO_DIR}/${ISO_NAME}"

          WORKDIR=$(mktemp -d)
          trap 'sudo rm -rf "$WORKDIR"' EXIT

          # 写出子证书私钥/证书（构建完即删除）
          echo "$GRUB_SIGNING_KEY"  > "$WORKDIR/boot.key"
          echo "$GRUB_SIGNING_CERT" > "$WORKDIR/boot.crt"
          chmod 600 "$WORKDIR/boot.key"

          sign_efi() {
              local f="$1"
              sbattach --remove "$f" 2>/dev/null || true
              sbsign --key "$WORKDIR/boot.key" --cert "$WORKDIR/boot.crt" \
                     --output "$f" "$f"
              sbverify --cert "$WORKDIR/boot.crt" "$f"
          }

          # ---------- 提取 /EFI ----------
          sudo xorriso -osirrox on -indev "$ISO_PATH" \
              -extract /EFI "$WORKDIR/EFI" 2>/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$WORKDIR/EFI"
          echo "==> EFI directory layout:"
          find "$WORKDIR/EFI" -type f | sort

          # ---------- 替换 shim ----------
          SHIM_SRC="${{ github.workspace }}/installer/secure_boot/shimx64.efi"
          if [[ -f "$SHIM_SRC" ]]; then
              sudo cp "$SHIM_SRC" "$WORKDIR/EFI/BOOT/BOOTX64.EFI"
              sudo mkdir -p "$WORKDIR/EFI/aceos"
              sudo cp "$SHIM_SRC" "$WORKDIR/EFI/aceos/shimx64.efi"
              # 兼容：ISO 里如果有 fedora 目录也替换
              [[ -f "$WORKDIR/EFI/fedora/shimx64.efi" ]] && \
                  sudo cp "$SHIM_SRC" "$WORKDIR/EFI/fedora/shimx64.efi"
          fi

          # ---------- 签名 grub ----------
          [[ -f "$WORKDIR/EFI/aceos/grubx64.efi"  ]] && sign_efi "$WORKDIR/EFI/aceos/grubx64.efi"
          [[ -f "$WORKDIR/EFI/fedora/grubx64.efi" ]] && sign_efi "$WORKDIR/EFI/fedora/grubx64.efi"
          [[ -f "$WORKDIR/EFI/BOOT/grubx64.efi"   ]] && sign_efi "$WORKDIR/EFI/BOOT/grubx64.efi"

          # ---------- 写回 /EFI ----------
          sudo xorriso -indev "$ISO_PATH" -outdev "$WORKDIR/iso_tmp.iso" \
              -map "$WORKDIR/EFI" /EFI \
              -boot_image any replay -commit 2>/dev/null
          sudo mv -f "$WORKDIR/iso_tmp.iso" "$ISO_PATH"

          # ---------- 签名 /images/pxeboot/vmlinuz ----------
          sudo xorriso -osirrox on -indev "$ISO_PATH" \
              -extract /images/pxeboot/vmlinuz "$WORKDIR/vmlinuz" 2>/dev/null
          sudo chown "$(id -u):$(id -g)" "$WORKDIR/vmlinuz"
          sign_efi "$WORKDIR/vmlinuz"
          sudo xorriso -indev "$ISO_PATH" -outdev "$WORKDIR/iso_tmp.iso" \
              -map "$WORKDIR/vmlinuz" /images/pxeboot/vmlinuz \
              -boot_image any replay -commit 2>/dev/null
          sudo mv -f "$WORKDIR/iso_tmp.iso" "$ISO_PATH"

          # ---------- 同步更新 /images/efiboot.img ----------
          if sudo xorriso -osirrox on -indev "$ISO_PATH" \
              -extract /images/efiboot.img "$WORKDIR/efiboot.img" 2>/dev/null; then
            if command -v mcopy >/dev/null 2>&1; then
                # grub
                if [[ -f "$WORKDIR/EFI/aceos/grubx64.efi" ]]; then
                    mcopy -D o -i "$WORKDIR/efiboot.img" \
                        "$WORKDIR/EFI/aceos/grubx64.efi" ::/EFI/aceos/grubx64.efi 2>/dev/null || true
                    mcopy -D o -i "$WORKDIR/efiboot.img" \
                        "$WORKDIR/EFI/aceos/grubx64.efi" ::/EFI/BOOT/grubx64.efi  2>/dev/null || true
                elif [[ -f "$WORKDIR/EFI/fedora/grubx64.efi" ]]; then
                    mcopy -D o -i "$WORKDIR/efiboot.img" \
                        "$WORKDIR/EFI/fedora/grubx64.efi" ::/EFI/fedora/grubx64.efi 2>/dev/null || true
                    mcopy -D o -i "$WORKDIR/efiboot.img" \
                        "$WORKDIR/EFI/fedora/grubx64.efi" ::/EFI/BOOT/grubx64.efi   2>/dev/null || true
                fi
                # shim
                if [[ -f "$SHIM_SRC" ]]; then
                    mcopy -D o -i "$WORKDIR/efiboot.img" \
                        "$SHIM_SRC" ::/EFI/BOOT/BOOTX64.EFI   2>/dev/null || true
                    mcopy -D o -i "$WORKDIR/efiboot.img" \
                        "$SHIM_SRC" ::/EFI/aceos/shimx64.efi   2>/dev/null || true
                fi
            fi
            sudo xorriso -indev "$ISO_PATH" -outdev "$WORKDIR/iso_tmp.iso" \
                -map "$WORKDIR/efiboot.img" /images/efiboot.img \
                -boot_image any replay -commit 2>/dev/null && \
            sudo mv -f "$WORKDIR/iso_tmp.iso" "$ISO_PATH" || \
            echo "WARNING: efiboot.img write-back failed, skipping"
          else
            echo "WARNING: efiboot.img not found in ISO, skipping"
          fi

          # ---------- 更新 MD5 ----------
          sudo implantisomd5 "$ISO_PATH"
          sudo checkisomd5 "$ISO_PATH"

          rm -f "$WORKDIR/boot.key" "$WORKDIR/boot.crt"

      - name: Move ISOs to Upload Directory
        id: upload-directory
        shell: bash
        run: |
          set -euo pipefail

          ISO_UPLOAD_DIR=${{ github.workspace }}/upload
          ISO_DIR=$(readlink -f "${{ steps.build.outputs.iso_path }}")
          ISO_NAME="${{ steps.build.outputs.iso_name }}"

          # 发布时把文件名里的 bazzite 换成 aceos（例如
          # bazzite-nvidia-open-testing-amd64.iso -> aceos-nvidia-open-testing-amd64.iso），
          # 这样 UEFIInstall 里硬编码的 aceos-*.iso 常量就能对上。
          # 仅在 Move 阶段重命名，不影响构建过程使用的 image_name。
          ACEOS_ISO_NAME="${ISO_NAME//bazzite/aceos}"
          ISO_DEST=${ISO_UPLOAD_DIR}/${ACEOS_ISO_NAME}

          mkdir -p "${ISO_UPLOAD_DIR}"
          mv "${ISO_DIR}/${ISO_NAME}" "${ISO_DEST}"
          sha256sum "${ISO_DEST}" > "${ISO_DEST}-CHECKSUM"

          echo "iso-upload-dir=${ISO_UPLOAD_DIR}" >> "$GITHUB_OUTPUT"
          echo "iso-artifact-path=${ISO_DEST}" >> "$GITHUB_OUTPUT"
          echo "checksum-artifact-path=${ISO_DEST}-CHECKSUM" >> "$GITHUB_OUTPUT"






      - name: Compute AceOS Artifact Name
        id: aceos-artifact-name
        shell: bash
        run: |
          # 把 image_name 里的 bazzite 换成 aceos，例如
          # bazzite-nvidia-open -> aceos-nvidia-open
          RAW="${{ matrix.image_name }}-${{ steps.generate-tag.outputs.tag }}-${{ matrix.major_version }}"
          NAME="${RAW//bazzite/aceos}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload ISOs and Checksum to Job Artifacts
        if: github.ref_name == 'testing' || github.ref_name == 'main'
        #if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          # 发布时把 image_name 里的 bazzite 换成 aceos（例如
          # bazzite-nvidia-open-testing-43 -> aceos-nvidia-open-testing-43），
          # 与 ISO 文件名保持一致。matrix.image_name 保持原样，不影响构建过程。
          name: ${{ steps.aceos-artifact-name.outputs.name }}
          path: |
            ${{ steps.upload-directory.outputs.iso-artifact-path }}
            ${{ steps.upload-directory.outputs.checksum-artifact-path }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true


      - name: Upload ISOs and Checksum to R2
        if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
        shell: bash
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SOURCE_DIR: ${{ steps.upload-directory.outputs.iso-upload-dir }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR R2:bazzite
